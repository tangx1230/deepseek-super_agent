<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="响应式 Todo 待办事项应用,数据保存在浏览器本地。">
  <meta name="color-scheme" content="light">
  <title>待办事项</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" aria-labelledby="app-title">
    <header class="app-header">
      <h1 id="app-title">待办事项</h1>
      <p class="app-subtitle">记录每一件小事,逐项完成</p>
    </header>

    <section class="composer" aria-label="新增待办">
      <form id="todo-form" class="composer-form" novalidate>
        <div class="composer-row">
          <label class="sr-only" for="todo-input">待办内容</label>
          <input
            id="todo-input"
            class="todo-input"
            type="text"
            name="title"
            placeholder="要做什么?"
            maxlength="100"
            autocomplete="off"
            aria-describedby="input-hint input-error"
          >
          <button type="submit" class="add-button">添加</button>
        </div>
        <div class="composer-priority">
          <span class="composer-label" id="priority-label">分类</span>
          <div class="priority-options" role="radiogroup" aria-labelledby="priority-label">
            <label class="priority-option">
              <input class="priority-radio sr-only" type="radio" name="priority" value="normal" checked>
              <span class="priority-option-label">一般</span>
            </label>
            <label class="priority-option">
              <input class="priority-radio sr-only" type="radio" name="priority" value="urgent">
              <span class="priority-option-label priority-option-label--urgent">紧急</span>
            </label>
          </div>
        </div>
        <div class="composer-schedule">
          <label class="composer-label" for="todo-due">指定时间<small class="schedule-optional">(可选)</small></label>
          <input
            id="todo-due"
            class="due-input"
            type="datetime-local"
            name="dueAt"
            step="60"
          >
        </div>
      </form>
      <div class="composer-meta">
        <span id="input-hint" class="input-hint">最多 100 字</span>
        <span id="char-count" class="char-count" aria-hidden="true">0/100</span>
      </div>
      <p id="input-error" class="input-error" role="alert" hidden>请输入内容</p>
    </section>

    <ul id="todo-list" class="todo-list" aria-label="待办列表"></ul>

    <div id="empty-state" class="empty-state" hidden>
      <span class="empty-icon" aria-hidden="true">📝</span>
      <p class="empty-text">暂无待办,添加一条吧</p>
    </div>

    <nav class="filters" aria-label="筛选待办">
      <div class="filter-tabs" role="tablist" aria-label="按完成状态筛选">
        <button type="button" class="filter-tab is-active" role="tab" aria-selected="true" data-filter="all">全部</button>
        <button type="button" class="filter-tab" role="tab" aria-selected="false" data-filter="active">未完成</button>
        <button type="button" class="filter-tab" role="tab" aria-selected="false" data-filter="completed">已完成</button>
      </div>
    </nav>

    <footer class="status-bar">
      <span id="remaining-count" class="remaining-count">剩余 0 项未完成</span>
      <button id="clear-completed" type="button" class="clear-button" disabled>清除已完成</button>
    </footer>

    <section class="dates-section" aria-labelledby="dates-title">
      <header class="dates-header">
        <h2 id="dates-title" class="dates-title">重要日子</h2>
        <p class="dates-subtitle">记下朋友生日和纪念日,每年自动倒数</p>
      </header>

      <form id="date-form" class="date-form" novalidate>
        <div class="date-row">
          <label class="composer-label" for="date-name">名称</label>
          <input
            id="date-name"
            class="date-input"
            type="text"
            name="name"
            placeholder="如:小王生日"
            maxlength="30"
            autocomplete="off"
            aria-describedby="date-error"
          >
        </div>
        <div class="date-row">
          <span class="composer-label" id="date-parts-label">日期</span>
          <div class="date-parts" role="group" aria-labelledby="date-parts-label">
            <label class="sr-only" for="date-month">月份</label>
            <select id="date-month" class="date-select" name="month" aria-describedby="date-error"></select>
            <label class="sr-only" for="date-day">日期</label>
            <select id="date-day" class="date-select" name="day" aria-describedby="date-error"></select>
            <label class="sr-only" for="date-year">年份(选填)</label>
            <input
              id="date-year"
              class="date-input date-year"
              type="number"
              name="year"
              inputmode="numeric"
              placeholder="年份(选填)"
              aria-describedby="date-error"
            >
          </div>
        </div>
        <div class="date-row">
          <label class="composer-label" for="date-note">备注</label>
          <input
            id="date-note"
            class="date-input"
            type="text"
            name="note"
            placeholder="选填,如:喜欢巧克力"
            maxlength="50"
            autocomplete="off"
          >
        </div>
        <p id="date-error" class="input-error" role="alert" hidden></p>
        <button type="submit" class="date-add-button">添加</button>
      </form>

      <ul id="date-list" class="date-list" aria-label="重要日子列表"></ul>

      <div id="date-empty" class="date-empty" hidden>
        <span class="date-empty-icon" aria-hidden="true">🎂</span>
        <p class="date-empty-text">还没有重要日子,记下朋友的生日吧</p>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
