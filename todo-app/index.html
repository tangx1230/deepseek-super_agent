<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="响应式待办与日程应用,数据保存在浏览器本地。">
  <meta name="color-scheme" content="light">
  <title>待办与日程</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" aria-labelledby="app-title">
    <header class="app-header">
      <h1 id="app-title">待办与日程</h1>
      <p class="app-subtitle">记录待办,安排日程,从容过好每一天</p>
    </header>

    <section class="schedule" aria-labelledby="schedule-title">
      <div class="section-heading">
        <h2 id="schedule-title" class="section-title">日程安排</h2>
        <div class="calendar-controls">
          <button id="calendar-prev" type="button" class="calendar-nav" aria-label="上个月">‹</button>
          <span id="calendar-month" class="calendar-month" aria-live="polite">2026年11月</span>
          <button id="calendar-next" type="button" class="calendar-nav" aria-label="下个月">›</button>
          <button id="calendar-today" type="button" class="calendar-today">今天</button>
        </div>
      </div>

      <div id="calendar" class="calendar" role="grid" aria-label="月份日历">
        <div class="calendar-weekdays" role="row">
          <span role="columnheader" aria-label="星期一">一</span>
          <span role="columnheader" aria-label="星期二">二</span>
          <span role="columnheader" aria-label="星期三">三</span>
          <span role="columnheader" aria-label="星期四">四</span>
          <span role="columnheader" aria-label="星期五">五</span>
          <span role="columnheader" aria-label="星期六">六</span>
          <span role="columnheader" aria-label="星期日">日</span>
        </div>
      </div>

      <div class="day-panel">
        <div class="day-panel-header">
          <h3 id="selected-date" class="selected-date" aria-live="polite">11月25日 周三</h3>
          <span id="schedule-count" class="schedule-count">0 个日程</span>
        </div>

        <form id="schedule-form" class="schedule-form" novalidate>
          <div class="schedule-fields">
            <div class="schedule-field schedule-field--time">
              <label class="schedule-label" for="schedule-time">时间</label>
              <input id="schedule-time" class="schedule-time" type="time" name="time" step="60">
            </div>
            <div class="schedule-field schedule-field--title">
              <label class="schedule-label" for="schedule-input">日程</label>
              <input
                id="schedule-input"
                class="schedule-input"
                type="text"
                name="title"
                placeholder="当天要做什么?"
                maxlength="100"
                autocomplete="off"
                aria-describedby="schedule-hint schedule-error"
              >
            </div>
          </div>
          <div class="schedule-actions">
            <span id="schedule-hint" class="schedule-hint">时间留空即为全天</span>
            <button type="submit" class="schedule-add">添加日程</button>
          </div>
          <p id="schedule-error" class="schedule-error" role="alert" hidden>请输入日程内容</p>
        </form>

        <ul id="schedule-list" class="schedule-list" aria-label="当天日程"></ul>
        <p id="schedule-empty" class="schedule-empty" hidden>当天暂无日程</p>
      </div>
    </section>

    <section class="composer" aria-label="新增待办">
      <form id="todo-form" class="composer-form" novalidate>
        <div class="composer-row">
          <label class="sr-only" for="todo-input">待办内容</label>
          <input
            id="todo-input"
            class="todo-input"
            type="text"
            name="title"
            placeholder="要做什么?"
            maxlength="100"
            autocomplete="off"
            aria-describedby="input-hint input-error"
          >
          <button type="submit" class="add-button">添加</button>
        </div>
        <div class="composer-priority">
          <span class="composer-label" id="priority-label">分类</span>
          <div class="priority-options" role="radiogroup" aria-labelledby="priority-label">
            <label class="priority-option">
              <input class="priority-radio sr-only" type="radio" name="priority" value="normal" checked>
              <span class="priority-option-label">一般</span>
            </label>
            <label class="priority-option">
              <input class="priority-radio sr-only" type="radio" name="priority" value="urgent">
              <span class="priority-option-label priority-option-label--urgent">紧急</span>
            </label>
          </div>
        </div>
        <div class="composer-schedule">
          <label class="composer-label" for="todo-due">指定时间<small class="schedule-optional">(可选)</small></label>
          <input
            id="todo-due"
            class="due-input"
            type="datetime-local"
            name="dueAt"
            step="60"
          >
        </div>
      </form>
      <div class="composer-meta">
        <span id="input-hint" class="input-hint">最多 100 字</span>
        <span id="char-count" class="char-count" aria-hidden="true">0/100</span>
      </div>
      <p id="input-error" class="input-error" role="alert" hidden>请输入内容</p>
    </section>

    <ul id="todo-list" class="todo-list" aria-label="待办列表"></ul>

    <div id="empty-state" class="empty-state" hidden>
      <span class="empty-icon" aria-hidden="true">📝</span>
      <p class="empty-text">暂无待办,添加一条吧</p>
    </div>

    <nav class="filters" aria-label="筛选待办">
      <div class="filter-tabs" role="tablist" aria-label="按完成状态筛选">
        <button type="button" class="filter-tab is-active" role="tab" aria-selected="true" data-filter="all">全部</button>
        <button type="button" class="filter-tab" role="tab" aria-selected="false" data-filter="active">未完成</button>
        <button type="button" class="filter-tab" role="tab" aria-selected="false" data-filter="completed">已完成</button>
      </div>
    </nav>

    <footer class="status-bar">
      <span id="remaining-count" class="remaining-count">剩余 0 项未完成</span>
      <button id="clear-completed" type="button" class="clear-button" disabled>清除已完成</button>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
